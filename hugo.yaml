baseURL: "https://varas-onemind.github.io/"
languageCode: "en-us"
title: "VARAS"
theme: ["PaperMod"]

enableRobotsTXT: true

params:
  env: production
  title: "VARAS"
  description: "Vulnerability Analysis & Research Agent System"
  author: "VARAS"

  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true

  profileMode:
    enabled: true
    title: "VARAS"
    subtitle: "Vulnerability Analysis & Research Agent System"

    buttons:
      - name: Research
        url: "/research/"
      - name: Projects
        url: "/projects/"
      - name: Blog
        url: "/posts/"

  socialIcons:
    - name: github
      url: "https://github.com/varas-onemind"

menu:
  main:
    - identifier: research
      name: Research
      url: /research/
      weight: 10

    - identifier: projects
      name: Projects
      url: /projects/
      weight: 20

    - identifier: posts
      name: Blog
      url: /posts/
      weight: 30

    - identifier: about
      name: About
      url: /about/
      weight: 40
